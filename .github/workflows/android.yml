name: Android and accounting checks
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore: ['.github/workflows/verify-packaged-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accounting:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CI-only-Accounting-2026!
        ports: ["1433:1433"]
    env:
      TEST_SQL_CONNECTION: Server=localhost,1433;Database=master;User ID=sa;Password=CI-only-Accounting-2026!;Encrypt=True;TrustServerCertificate=True
      ConnectionStrings__Supermarket: Server=localhost,1433;Database=SupermarketAccounting;User ID=sa;Password=CI-only-Accounting-2026!;Encrypt=True;TrustServerCertificate=True
      ApiKey: ci-only-api-key-not-a-production-secret-2026
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build API
        run: dotnet build src/Supermarket.Api -c Release
      - name: Verify SQL posting and balances
        run: dotnet run --project tests/Supermarket.DatabaseChecks -- database
      - name: Verify HTTP API, posting, retries and rejected requests
        run: python3 tests/api_smoke.py --disposable-database
      - name: Check mobile serialization with reflection disabled and trimming enabled
        run: |
          dotnet publish tests/Supermarket.MobileSerializationChecks -c Release -r linux-x64 --self-contained true -p:PublishTrimmed=true -p:JsonSerializerIsReflectionEnabledByDefault=false -o artifacts/mobile-json
          artifacts/mobile-json/Supermarket.MobileSerializationChecks
      - name: Package API
        run: dotnet publish src/Supermarket.Api -c Release --no-build -o artifacts/api
      - uses: actions/upload-artifact@v4
        with:
          name: supermarket-api
          path: artifacts/api
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install Android workload
        run: dotnet workload install maui-android --skip-manifest-update
      - name: Publish development APK for LAN testing
        run: dotnet publish mobile/Supermarket.Android -c Debug -p:AndroidPackageFormats=apk
      - uses: actions/upload-artifact@v4
        with:
          name: supermarket-android-debug
          path: mobile/Supermarket.Android/bin/Debug/**/*-Signed.apk
          if-no-files-found: error
      - name: Publish HTTPS APK
        run: dotnet publish mobile/Supermarket.Android -c Release -p:AndroidPackageFormats=apk
      - uses: actions/upload-artifact@v4
        with:
          name: supermarket-android-https
          path: mobile/Supermarket.Android/bin/Release/**/*-Signed.apk
          if-no-files-found: error
      - name: Build original Windows app
        run: dotnet publish src/SupermarketAccounting -c Release --self-contained false -o artifacts/windows
      - uses: actions/upload-artifact@v4
        with:
          name: supermarket-windows
          path: artifacts/windows
  android-launch:
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: supermarket-android-debug
          path: artifacts/android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch APK on Android emulator and inspect first-run settings
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python3 tests/android_launch.py artifacts/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-launch-diagnostics
          path: artifacts/android-launch
