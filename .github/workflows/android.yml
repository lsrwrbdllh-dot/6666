name: Madar standalone Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: madar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/Madar.OfflineChecks -c Release
      - run: dotnet run --project tests/Madar.OfflineChecks -c Release -- --arabic
      - uses: actions/cache@v4
        with:
          path: artifacts/models
          key: qwen3-06b-q4km-9acfc1e001311f34
      - run: python3 scripts/download-ai-model.py artifacts/models/Qwen3-0.6B-Q4_K_M.gguf
      - name: Build matching host AI backend
        run: |
          git init artifacts/ai-host-source
          git -C artifacts/ai-host-source fetch --depth 1 https://github.com/ggml-org/llama.cpp.git 815a2a5915f22ce6a760c676389c5dfe8535c08f
          git -C artifacts/ai-host-source checkout --detach FETCH_HEAD
          cmake -S artifacts/ai-host-source -B artifacts/ai-host -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_BACKEND_DL=OFF -DLLAMA_BUILD_COMMON=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_MTMD=OFF
          cmake --build artifacts/ai-host --parallel 4 --target llama
      - name: Check real Arabic local inference and model integrity
        run: dotnet run --project tests/Madar.AiChecks -c Release -- artifacts/ai-host/bin artifacts/models/Qwen3-0.6B-Q4_K_M.gguf
      - run: dotnet build tests/Madar.UiHost -c Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/ui_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madar-ui-checks
          path: artifacts/ui
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - run: dotnet workload install maui-android --skip-manifest-update
      - uses: actions/cache@v4
        id: ai-native
        with:
          path: artifacts/ai-native
          key: portable-ai-815a2a5915-r28c-armv8a-x64-16k-v1
      - name: Install pinned NDK
        if: steps.ai-native.outputs.cache-hit != 'true'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"'
      - name: Build baseline phone and emulator AI libraries
        if: steps.ai-native.outputs.cache-hit != 'true'
        run: python3 scripts/build-ai-native.py --ndk "$ANDROID_HOME/ndk/28.2.13676358"
      - name: Build standalone phone APK
        run: dotnet publish mobile/Supermarket.Android -c Release -r android-arm64 -p:AndroidPackageFormats=apk
      - uses: actions/upload-artifact@v4
        with:
          name: madar-android-arm64
          path: mobile/Supermarket.Android/bin/Release/**/publish/*-Signed.apk
          if-no-files-found: error
      - name: Build emulator APK
        run: dotnet publish mobile/Supermarket.Android -c Debug -r android-x64 -p:AndroidPackageFormats=apk
      - uses: actions/upload-artifact@v4
        with:
          name: madar-android-emulator
          path: mobile/Supermarket.Android/bin/Debug/**/publish/*-Signed.apk
          if-no-files-found: error
  android-launch:
    runs-on: ubuntu-latest
    needs: [android, offline-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: madar-android-emulator
          path: artifacts/android
      - uses: actions/cache@v4
        with:
          path: artifacts/models
          key: qwen3-06b-q4km-9acfc1e001311f34
      - run: python3 scripts/download-ai-model.py artifacts/models/Qwen3-0.6B-Q4_K_M.gguf
      - run: python3 -m pip install websocket-client==1.8.0
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 4096
          script: |
            python3 tests/android_launch.py artifacts/android
            python3 tests/android_ai.py artifacts/models/Qwen3-0.6B-Q4_K_M.gguf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madar-android-launch
          path: |
            artifacts/android-launch
            artifacts/android-ai
