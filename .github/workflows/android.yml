name: Madar standalone Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: madar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/Madar.OfflineChecks -c Release
      - run: dotnet run --project tests/Madar.OfflineChecks -c Release -- --arabic
      - run: dotnet build tests/Madar.UiHost -c Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/ui_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madar-ui-checks
          path: artifacts/ui
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - run: dotnet workload install maui-android --skip-manifest-update
      - name: Build standalone phone APK
        run: dotnet publish mobile/Supermarket.Android -c Release -r android-arm64 -p:AndroidPackageFormats=apk
      - uses: actions/upload-artifact@v4
        with:
          name: madar-android-arm64
          path: mobile/Supermarket.Android/bin/Release/**/publish/*-Signed.apk
          if-no-files-found: error
      - name: Build emulator APK
        run: dotnet publish mobile/Supermarket.Android -c Debug -r android-x64 -p:AndroidPackageFormats=apk
      - uses: actions/upload-artifact@v4
        with:
          name: madar-android-emulator
          path: mobile/Supermarket.Android/bin/Debug/**/publish/*-Signed.apk
          if-no-files-found: error
  android-launch:
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: madar-android-emulator
          path: artifacts/android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python3 tests/android_launch.py artifacts/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madar-android-launch
          path: artifacts/android-launch
